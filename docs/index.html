<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>浦添市 人口ピラミッド・推移ダッシュボード</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>浦添市 人口ピラミッド・推移ダッシュボード</h1>
    <p>浦添市が公開する年齢別・男女別人口データをもとに可視化しています。</p>
  </header>

  <div id="error-message" hidden></div>

  <main>
    <section id="controls">
      <label for="year-month-select">表示する年月</label>
      <select id="year-month-select"></select>
    </section>

    <section id="summary">
      <span>総人口</span>
      <strong id="summary-total">-</strong>
    </section>

    <section id="generation-cards">
      <div class="gen-card gen-child">
        <span class="gen-icon" aria-hidden="true">👶</span>
        <span class="gen-label">年少人口<br>(0-14歳)</span>
        <strong class="gen-count" id="card-child-count">-</strong>
        <span class="gen-rate" id="card-child-rate">-</span>
      </div>
      <div class="gen-card gen-working">
        <span class="gen-icon" aria-hidden="true">🧑‍💼</span>
        <span class="gen-label">生産年齢人口<br>(15-64歳)</span>
        <strong class="gen-count" id="card-working-count">-</strong>
        <span class="gen-rate" id="card-working-rate">-</span>
      </div>
      <div class="gen-card gen-elderly">
        <span class="gen-icon" aria-hidden="true">👴</span>
        <span class="gen-label">高齢人口<br>(65歳以上)</span>
        <strong class="gen-count" id="card-elderly-count">-</strong>
        <span class="gen-rate" id="card-elderly-rate">-</span>
      </div>
    </section>

    <section id="generation-pie-section">
      <h2>世代別の割合</h2>
      <div style="height: 320px;">
        <canvas id="generation-pie-chart"></canvas>
      </div>
    </section>

    <section id="pyramid-section">
      <h2>年齢別人口ピラミッド(年代別・10歳刻み)</h2>
      <div style="height: 500px;">
        <canvas id="pyramid-chart"></canvas>
      </div>
    </section>

    <section id="trend-section">
      <h2>世代別 人口推移</h2>
      <p class="trend-note">3つのグラフは縦軸の目盛り幅をそろえているので、線の傾きで増減の大きさを比べられます。</p>
      <div id="trend-grid">
        <div class="trend-item">
          <h3>年少人口(0-14歳)</h3>
          <div style="height: 220px;">
            <canvas id="trend-chart-child"></canvas>
          </div>
        </div>
        <div class="trend-item">
          <h3>生産年齢人口(15-64歳)</h3>
          <div style="height: 220px;">
            <canvas id="trend-chart-working"></canvas>
          </div>
        </div>
        <div class="trend-item">
          <h3>高齢人口(65歳以上)</h3>
          <div style="height: 220px;">
            <canvas id="trend-chart-elderly"></canvas>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
